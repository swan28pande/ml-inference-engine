name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ORT_VERSION: "1.22.0"

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cpu / onnxruntime / release
            ort: true
            build_type: Release
            extra: ""
          - name: cpu / minimal (no onnxruntime)
            ort: false
            build_type: Release
            extra: "-DMIE_WITH_ONNXRUNTIME=OFF"
          - name: cpu / asan+ubsan / debug
            ort: false
            build_type: Debug
            extra: "-DMIE_WITH_ONNXRUNTIME=OFF -DMIE_SANITIZER=address"
          # Engine only: the distro gRPC libraries are not TSan-instrumented.
          - name: cpu / tsan / engine
            ort: false
            build_type: RelWithDebInfo
            extra: "-DMIE_WITH_ONNXRUNTIME=OFF -DMIE_BUILD_SERVER=OFF -DMIE_BUILD_BENCHMARKS=OFF -DMIE_SANITIZER=thread"
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config ccache \
            libgrpc++-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc libgtest-dev

      - name: Allow sanitizer shadow memory
        # TSan/ASan cannot map their shadow regions with the default 32-bit mmap ASLR entropy.
        if: contains(matrix.extra, 'MIE_SANITIZER')
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Fetch ONNX Runtime
        if: matrix.ort
        run: scripts/fetch_onnxruntime.sh

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.name }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.name }}-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DONNXRUNTIME_ROOT=${{ github.workspace }}/third_party/onnxruntime \
            -DMIE_WARNINGS_AS_ERRORS=ON \
            ${{ matrix.extra }}

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure --timeout 180 --parallel 2

      - name: Engine benchmark (smoke)
        if: matrix.build_type == 'Release'
        run: |
          build/benchmarks/mie_engine_benchmark --backend reference \
            --fixed_latency_us 400 --per_sample_latency_us 5 --instances 2 \
            --concurrency 64 --duration_s 2 --batch_sizes 1,8,32 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: End-to-end gRPC smoke test
        if: matrix.build_type == 'Release'
        run: |
          if [ "${{ matrix.ort }}" = "true" ]; then CONFIG=configs/server.pbtxt; MODEL=mlp; \
          else CONFIG=configs/server.reference.pbtxt; MODEL=reference; fi
          build/src/mie_server --config "$CONFIG" --address 127.0.0.1:50051 &
          SERVER_PID=$!
          for i in $(seq 1 30); do build/src/mie_health_probe --address 127.0.0.1:50051 && break; sleep 1; done
          build/benchmarks/mie_loadgen --address 127.0.0.1:50051 --model "$MODEL" \
            --concurrency 32 --duration_s 5 --warmup_s 1 | tee -a "$GITHUB_STEP_SUMMARY"
          kill -TERM "$SERVER_PID"
          wait "$SERVER_PID"   # graceful shutdown must exit 0

      - name: Python client
        if: matrix.ort
        run: |
          python3 -m venv .venv && . .venv/bin/activate
          pip install -q -r client/requirements.txt
          build/src/mie_server --config configs/server.pbtxt --address 127.0.0.1:50052 &
          SERVER_PID=$!
          python client/inference_client.py demo --address 127.0.0.1:50052 --duration 3
          kill -TERM "$SERVER_PID" && wait "$SERVER_PID"

  # Hosted runners have no GPU: this job verifies that the CUDA kernels, the
  # device memory pool and the TensorRT backend compile and link.
  cuda-tensorrt-build:
    name: cuda + tensorrt (compile only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install CUDA toolkit and TensorRT
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libgrpc++-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc libgtest-dev \
            cuda-nvcc-12-8 cuda-cudart-dev-12-8 cuda-nvml-dev-12-8
          # Pick the newest TensorRT 10 build that targets CUDA 12.x.
          TRT_VERSION=$(apt-cache madison libnvinfer-dev | awk '{print $3}' | grep -E '^10\..*\+cuda12' | sort -V | tail -1)
          echo "Installing TensorRT ${TRT_VERSION}"
          sudo apt-get install -y --no-install-recommends \
            "libnvinfer-dev=${TRT_VERSION}" "libnvinfer-headers-dev=${TRT_VERSION}" "libnvinfer10=${TRT_VERSION}" \
            "libnvonnxparsers-dev=${TRT_VERSION}" "libnvonnxparsers10=${TRT_VERSION}"
          echo "/usr/local/cuda-12.8/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda-12.8/bin/nvcc \
            -DMIE_WITH_CUDA=ON -DMIE_WITH_TENSORRT=ON -DMIE_WITH_NVML=ON \
            -DMIE_WITH_ONNXRUNTIME=OFF -DMIE_CUDA_ARCHITECTURES="80;89" \
            -DMIE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

  docker:
    name: docker image (cpu)
    runs-on: ubuntu-24.04
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mie-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container and probe health
        run: |
          docker run -d --name mie -p 50051:50051 mie-server:ci
          for i in $(seq 1 30); do
            docker exec mie mie_health_probe --address localhost:50051 && break; sleep 1
          done
          docker exec mie mie_loadgen --address localhost:50051 --model mlp --concurrency 16 --duration_s 3 --warmup_s 1
          docker stop -t 20 mie
          test "$(docker inspect -f '{{.State.ExitCode}}' mie)" = "0"
